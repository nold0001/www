<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 브론토</title>
<meta name="robots" content="noindex">
<script>
  // 404 는 어느 깊이의 주소에서도 열리므로 기준 경로를 고정한다.
  // 도메인 연결 전 GitHub Pages 주소(<계정>.github.io/<저장소>/)에서도 깨지지 않게 저장소 경로를 붙인다.
  document.write('<base href="' + (location.hostname.endsWith('github.io') ? '/' + location.pathname.split('/')[1] + '/' : '/') + '">');
</script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./" aria-label="브론토 홈"><img src="assets/logo.png" alt="bronto"></a>
  </div>
</header>
<main class="hero" style="min-height:70vh;display:grid;align-items:center">
  <div class="wrap" style="display:block">
    <span class="eyebrow">404</span>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p class="lead">주소가 바뀌었거나 없는 페이지입니다. 아래에서 원하시는 곳으로 이동해 주세요.</p>
    <div class="actions">
      <a class="btn btn-primary" href="./">홈으로</a>
      <a class="btn btn-ghost" href="tems/">tems</a>
      <a class="btn btn-ghost" href="tops/">tOps</a>
      <a class="btn btn-ghost" href="tvault/">tVault</a>
      <a class="btn btn-ghost" href="trial/">무료 평가판</a>
      <a class="btn btn-ghost" href="contact/">문의</a>
    </div>
  </div>
</main>
<script>
  // GitHub Pages 는 404 를 한 장만 쓰므로 주소의 언어 폴더(/en/ /ja/ /zh/)를 보고 문구와 링크를 바꾼다
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    if (location.hostname.endsWith('github.io')) parts.shift();
    var lang = ['en', 'ja', 'zh'].indexOf(parts[0]) >= 0 ? parts[0] : 'ko';
    if (lang === 'ko') return;
    var T = {
      en: ['Page not found | bronto', 'Page not found', 'The address may have changed or the page does not exist. Please choose where to go below.', 'Home', 'Free trial', 'Contact', 'en'],
      ja: ['ページが見つかりません | bronto', 'ページが見つかりません', 'アドレスが変更されたか、存在しないページです。下記から移動先をお選びください。', 'ホーム', '無料トライアル', 'お問い合わせ', 'ja'],
      zh: ['页面不存在 | bronto', '页面不存在', '网址可能已更改，或该页面不存在。请从下方选择要前往的页面。', '首页', '免费试用', '联系我们', 'zh-CN']
    }[lang];
    document.title = T[0];
    document.documentElement.lang = T[6];
    document.querySelector('h1').textContent = T[1];
    document.querySelector('.lead').textContent = T[2];
    var links = document.querySelectorAll('.actions a, .brand');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      a.setAttribute('href', lang + '/' + a.getAttribute('href').replace('./', ''));
      var k = { '홈으로': 3, '무료 평가판': 4, '문의': 5 }[a.textContent];
      if (k) a.textContent = T[k];
    }
  })();
</script>
</body>
</html>
