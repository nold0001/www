<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-label="작업 목록에서 점검 명령을 실행한 결과">
  <rect width="600" height="340" rx="18" fill="#eaf2fd"/>
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif">
