      <text x="60" y="138">디스크 사용량</text><text x="60" y="172">시간 동기화 확인</text><text x="60" y="206">로그 정리</text><text x="60" y="240">tems 재시작</text>
    </g>
    <rect x="240" y="36" width="324" height="268" rx="10" fill="#0b1626"/>
