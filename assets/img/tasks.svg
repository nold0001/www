      <text x="258" y="216" fill="#6ca5f2">$ df -h /</text>
      <text x="258" y="240" fill="#c9d4e3">/dev/sda1  64G  41G  <tspan fill="#f5a524">68%</tspan></text>
      <rect x="258" y="258" width="9" height="16" fill="#6ca5f2"/>
