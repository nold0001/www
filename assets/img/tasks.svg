      <text x="258" y="94" fill="#c9d4e3">bomni   <tspan fill="#22b37a">running</tspan></text>
      <text x="258" y="116" fill="#c9d4e3">cdev    <tspan fill="#22b37a">running</tspan></text>
      <text x="258" y="138" fill="#c9d4e3">chist   <tspan fill="#22b37a">running</tspan></text>
      <text x="258" y="160" fill="#c9d4e3">amodm   <tspan fill="#22b37a">running</tspan></text>
